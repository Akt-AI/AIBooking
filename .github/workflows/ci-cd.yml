name: Test and deploy pi
on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: '24'
          cache: npm
      - run: npm ci --ignore-scripts
      - run: npm test
      - run: docker build -t aibooking-ci .
  deploy:
    if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
    needs: test
    runs-on: ubuntu-latest
    timeout-minutes: 15
    environment: production
    concurrency:
      group: pi-production
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - name: Deploy tested revision
        env:
          PI_SSH_KEY: ${{ secrets.PI_SSH_KEY }}
          PI_KNOWN_HOSTS: ${{ secrets.PI_KNOWN_HOSTS }}
          PI_HOST: ${{ vars.PI_HOST }}
        run: |
          set -euo pipefail
          install -d -m 700 ~/.ssh
          printf '%s\n' "$PI_SSH_KEY" > ~/.ssh/pi_deploy
          chmod 600 ~/.ssh/pi_deploy
          printf '%s\n' "$PI_KNOWN_HOSTS" > ~/.ssh/known_hosts
          trap 'rm -f ~/.ssh/pi_deploy' EXIT
          git archive --format=tar HEAD | ssh -o BatchMode=yes -o StrictHostKeyChecking=yes -i ~/.ssh/pi_deploy "pi@$PI_HOST" "deploy $GITHUB_SHA"
      - name: Verify public endpoint
        run: curl --fail --silent --show-error --retry 5 --retry-delay 3 https://aibooking.store/api/status
